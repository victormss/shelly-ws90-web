# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ingest_limit:10m rate=15r/m;

# Upstream para el backend
upstream weather_api {
    server weather-api:8000;
}

# HTTP server — Fase inicial (hasta obtener certificado SSL)
server {
    listen 80;
    server_name meteo.victorsantos.com.es;

    server_tokens off;

    # Certbot ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Security headers (HTTP — sin HSTS)
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Frontend estático
    location / {
        root /var/www/weather-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            add_header Cache-Control "public, max-age=604800, immutable";
            # Re-incluir cabeceras de seguridad (add_header en location anula la herencia de server)
            include /etc/nginx/snippets/security-headers.conf;
        }
    }

    # API proxy — endpoints públicos (GET). CORS gestionado por FastAPI.
    # Sin add_header propio para heredar las cabeceras de seguridad del bloque server.
    location /api/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://weather_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API ingest — rate limit más estricto
    location /api/weather/ingest {
        limit_req zone=ingest_limit burst=5 nodelay;

        proxy_pass http://weather_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
