# Rate limiting zone
limit_req_zone $binary_remote_addr zone=api_limit_staging:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=ingest_limit_staging:10m rate=15r/m;

# Upstream para el backend staging
upstream weather_api_staging {
    server weather-api-staging:8000;
}

# HTTP — Redirige a HTTPS
server {
    listen 80;
    server_name meteotest.victorsantos.com.es;

    server_tokens off;

    # Certbot ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirigir todo lo demás a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name meteotest.victorsantos.com.es;

    # SSL — Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/meteotest.victorsantos.com.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meteotest.victorsantos.com.es/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # Banner de entorno staging
    add_header X-Environment "staging" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Frontend estático
    location / {
        root /var/www/weather-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache para assets estáticos
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            # Re-declarar security headers (Nginx no hereda add_header entre bloques)
            add_header X-Environment "staging" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
    }

    # API proxy — endpoints públicos (GET)
    location /api/ {
        limit_req zone=api_limit_staging burst=10 nodelay;

        proxy_pass http://weather_api_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Re-declarar security headers en este bloque
        add_header X-Environment "staging" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API ingest — rate limit más estricto
    location /api/weather/ingest {
        limit_req zone=ingest_limit_staging burst=5 nodelay;

        proxy_pass http://weather_api_staging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Re-declarar security headers
        add_header X-Environment "staging" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Bloquear acceso a archivos ocultos
    location ~ /\. {
        deny all;
    }
}
