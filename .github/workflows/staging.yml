name: Staging CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-asyncio httpx
          pip install -r weather-api/requirements.txt

      - name: Lint with flake8
        run: |
          flake8 weather-api/app --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 weather-api/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Docker Compose build
        run: docker compose build

  build-staging-image:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/weather-api
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - uses: docker/build-push-action@v5
        with:
          context: ./weather-api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-staging:
    needs: build-staging-image
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://meteotest.victorsantos.com.es
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/weather-station

            # Actualizar archivos de configuración desde el repo
            # (docker-compose.staging.yml ya debe estar en el servidor)

            # Login en GHCR para descargar imágenes privadas
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Descargar y desplegar
            docker compose -f docker-compose.staging.yml pull
            docker compose -f docker-compose.staging.yml up -d --remove-orphans

            # Esperar a que los servicios estén healthy
            sleep 15
            docker compose -f docker-compose.staging.yml ps

            # Health check
            curl -sf http://localhost/api/health || echo "⚠️ Health check failed"
