name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Asume 3.11, ajústalo según tu versión
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f weather-api/requirements.txt ]; then pip install -r weather-api/requirements.txt; fi

      - name: Lint with flake8
        run: |
          # Detiene la construcción si hay errores de sintaxis o variables indefinidas
          flake8 weather-api/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Advertencias de estilo
          flake8 weather-api/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Test Docker Compose build
        run: |
          # Comprueba que los servicios de docker compilan correctamente
          docker-compose build
